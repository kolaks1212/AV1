[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:telegram-bot-api]
command=/usr/local/bin/telegram-bot-api --local --api-id=%(ENV_TELEGRAM_API_ID)s --api-hash=%(ENV_TELEGRAM_API_HASH)s --dir=%(ENV_TELEGRAM_WORK_DIR)s --temp-dir=%(ENV_TELEGRAM_TEMP_DIR)s --http-port=8081
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=python3 /app/bot.py
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0